name: macos

on:
  workflow_dispatch:
  push:
    branches: [main, test/clean-fresh-checkout]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    # No signing identity, helper build or GUI session: tests that need the
    # signed build or a browser skip by name (tests/_artifacts.py).
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.8.22"
      - name: Sync
        run: uv sync --frozen
      - name: Unit tests
        run: uv run python -B -m unittest discover -s tests
