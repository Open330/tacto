<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="tacto-options-title">
<title id="tacto-options-title">Tacto mark explorations: closed loop, open return (chosen), touch ring</title>
<rect width="960" height="400" fill="#f6f4ed"/>
<g font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" fill="#5f6b58" font-size="13">
<text x="40" y="40" font-size="12" letter-spacing="2">TACTO MARK EXPLORATIONS · 2026-10-15</text>
<text x="80" y="320">A · Closed loop</text><text x="80" y="340" font-size="11">One stroke closes into the crossbar.</text><text x="80" y="356" font-size="11">Rejected: reads as "b" below 32px.</text>
<text x="400" y="320" fill="#1b211c" font-weight="700">B · Open return (chosen)</text><text x="400" y="340" font-size="11">t whose crossbar runs on into a return arc;</text><text x="400" y="356" font-size="11">the gap is the next run. Holds at 16px.</text>
<text x="720" y="320">C · Touch ring</text><text x="720" y="340" font-size="11">Coral touch inside a replay ring.</text><text x="720" y="356" font-size="11">Rejected: close to generic record/refresh icons.</text>
</g>
