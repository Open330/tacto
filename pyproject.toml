[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tacto-runtime"
version = "1.0.0"
description = "Tacto — reusable computer use for Claude, Codex and agent-authored flows"
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core computer-use = the OS accessibility layer. The browser is driven as
    # just another app through this — no separate browser-automation stack.
    "pyobjc-framework-ApplicationServices>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    # Windows: UI Automation through COM (tacto/uia_backend.py).
    "comtypes>=1.4,<2; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Optional headless/programmatic web backend (tacto/browser.py). NOT needed for
# computer use of the user's real browser, which the AX driver already handles.
web = ["playwright>=1.40", "ada-url>=1.32,<2"]
native-visual = ["pyobjc-framework-ScreenCaptureKit>=10.0; sys_platform == 'darwin'"]

[dependency-groups]
# Checkout-only test and evaluation tooling: `uv sync` installs it, wheels do not.
# tiktoken counts prompt tokens exactly as the measured provider budget does.
dev = ["tiktoken>=0.14,<1"]

[project.scripts]
tacto = "tacto.cli:main"

[tool.setuptools]
packages = ["tacto"]
# This wheel distributes portable Python modules. Signed native executables,
# source-tree evaluation fixtures and mutable flow stores are not wheel data.
# Native installation uses the source checkout's build.sh + launcher/tacto;
# see docs/installation.md. Never copy a developer's signed binaries into wheels.
include-package-data = false
